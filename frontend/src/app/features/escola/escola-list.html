<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Linka</h2>

    <nav>
      <button class="active">📊 Visão geral</button>
      <button>🏫 Turmas</button>
      <button>👨‍🏫 Professores</button>
      <button>🎓 Alunos</button>
      <button>📄 Relatórios</button>
    </nav>
  </aside>

  <!-- CONTEÚDO -->
  <main class="content">

    <!-- TOPO -->
    <div *ngFor="let escola of escolas" class="topo">
      <h1>🏫 {{ escola.nome }}</h1>
      <span class="status" [class.ativo]="escola.ativo">
        {{ escola.ativo ? 'Ativo' : 'Inativo' }}
      </span>
    </div>

    <!-- ALERTA -->
    <div class="alerta">
      A plataforma está operando normalmente.
    </div>

    <!-- CARDS -->
    <div class="cards">

      <div class="card">
        <h3>Alunos</h3>
        <p class="numero">96</p>
      </div>

      <div class="card">
        <h3>Professores</h3>
        <p class="numero">8</p>
      </div>

      <div class="card">
        <h3>Turmas</h3>
        <p class="numero">12</p>
      </div>

      <div class="card">
        <h3>Média</h3>
        <p class="numero">71%</p>
      </div>

    </div>

    <!-- SEÇÕES -->
    <div class="grid">

      <!-- DESEMPENHO -->
      <div class="box">
        <h3>Desempenho por turma</h3>

        <div class="linha">
          <span>8º A</span>
          <div class="barra">
            <div class="progresso" style="width: 72%"></div>
          </div>
          <span>72%</span>
        </div>

        <div class="linha">
          <span>8º B</span>
          <div class="barra verde">
            <div class="progresso" style="width: 85%"></div>
          </div>
          <span>85%</span>
        </div>

      </div>

      <!-- ALERTAS -->
      <div class="box">
        <h3>Alunos que precisam de atenção</h3>

        <div class="aluno">
          <strong>Lucas</strong>
          <span class="badge">Atenção</span>
        </div>

        <div class="aluno">
          <strong>Juliana</strong>
          <span class="badge">Atenção</span>
        </div>

      </div>

    </div>

  </main>

</div>
