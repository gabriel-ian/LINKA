# Modelo: na subida, o nginx troca ${PORT}, ${BACKEND_URL} e
# ${NGINX_LOCAL_RESOLVERS} pelas variaveis de ambiente (ver Dockerfile).
# No docker-compose o backend e http://backend:3000; no Railway, o endereco
# interno do servico (ex.: http://backend.railway.internal:3000).
server {
  listen ${PORT};
  listen [::]:${PORT};
  root /usr/share/nginx/html;

  # Resolve o nome do backend de novo a cada 10 s: se ele for publicado de
  # novo e mudar de IP, o site continua achando a API.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  # Laudos de ate 10 MB passam pela API.
  client_max_body_size 12m;

  # API: o site chama /api/... e o nginx repassa para o backend (mesma origem,
  # sem CORS). O Swagger fica em /api/api.
  location /api/ {
    set $api ${BACKEND_URL};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # O service worker e a lista de arquivos dele nunca podem ficar em cache,
  # senao uma versao nova do site nao chega aos alunos.
  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
  location = /ngsw.json { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location ~* \.(js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rotas do Angular (/aluno, /escola/...) caem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
