<app-entrada-layout>
  <form class="etapa" (ngSubmit)="salvar()" novalidate>
    <h1 class="titulo">Boas-vindas à Linka!</h1>
    <p class="descricao">
      Você entrou com a senha que recebeu. Crie uma senha só sua ou continue usando a recebida.
    </p>

    <label class="campo-grupo">
      <span class="campo-rotulo">Nova senha</span>
      <span class="senha-caixa">
        <input
          class="campo"
          [class.campo--erro]="erroNova()"
          [type]="mostrarNova ? 'text' : 'password'"
          name="nova"
          autocomplete="new-password"
          placeholder="Mínimo 8 caracteres"
          [(ngModel)]="nova"
        />
        <button
          type="button"
          class="olho"
          [attr.aria-label]="mostrarNova ? 'Esconder senha' : 'Mostrar senha'"
          (click)="mostrarNova = !mostrarNova"
        >
          <img
            [src]="
              mostrarNova
                ? 'assets/entrada/icone-olho.svg'
                : 'assets/entrada/icone-olho-fechado.svg'
            "
            alt=""
          />
        </button>
      </span>
    </label>

    <label class="campo-grupo">
      <span class="campo-rotulo">Repita a nova senha</span>
      <span class="senha-caixa">
        <input
          class="campo"
          [class.campo--erro]="erroNova()"
          [type]="mostrarRepetir ? 'text' : 'password'"
          name="repetir"
          autocomplete="new-password"
          [(ngModel)]="repetir"
        />
        <button
          type="button"
          class="olho"
          [attr.aria-label]="mostrarRepetir ? 'Esconder senha' : 'Mostrar senha'"
          (click)="mostrarRepetir = !mostrarRepetir"
        >
          <img
            [src]="
              mostrarRepetir
                ? 'assets/entrada/icone-olho.svg'
                : 'assets/entrada/icone-olho-fechado.svg'
            "
            alt=""
          />
        </button>
      </span>
      @if (erroNova()) {
        <span class="msg-erro" role="alert">{{ erroNova() }}</span>
      }
    </label>

    @if (erro()) {
      <p class="alerta-erro" role="alert">{{ erro() }}</p>
    }

    <div class="acoes">
      <button type="submit" class="btn btn-primario btn-bloco" [disabled]="salvando()">
        {{ salvando() ? 'Salvando...' : 'Salvar nova senha' }}
      </button>
      <button
        type="button"
        class="btn btn-secundario btn-bloco"
        [disabled]="salvando()"
        (click)="manter()"
      >
        Manter a senha recebida
      </button>
    </div>
  </form>
</app-entrada-layout>
